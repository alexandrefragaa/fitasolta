name: Verify FitaSolta

on:
  push:
    branches:
      - main
      - fix/turso-storage-remove-pdf-upload
      - feat/persistent-evidence-workflow
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize lockfile and install clean dependencies
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile on integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/persistent-evidence-workflow'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize package lockfile"
            git push
          fi

      - name: Install clean dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check src/server.js

      - name: Check frontend syntax
        run: |
          node --check public/js/app.js
          node --check src/js/app.js

      - name: Run tests
        run: npm test

      - name: Upload synchronized lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: fitasolta-package-lock
          path: package-lock.json
          if-no-files-found: error
