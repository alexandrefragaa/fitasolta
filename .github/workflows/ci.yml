name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/debate-evidence-workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        run: node --check src/server.js

      - name: Run automated tests
        run: npm test
